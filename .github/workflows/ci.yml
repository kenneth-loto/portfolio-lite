name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!(**.md|.gitignore|.gitattributes|.lintstagedrc.json|.zed/**)'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Dependency Review
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause
          warn-only: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: always()
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Biome
        if: needs.changes.outputs.code == 'true'
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.3

      - name: Run Biome CI
        if: needs.changes.outputs.code == 'true'
        run: biome ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: always()
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Run typecheck
        if: needs.changes.outputs.code == 'true'
        run: bun typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: always()
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint, typecheck, test]
    if: always()
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - name: Fail if a required job upstream failed
        if: needs.changes.outputs.code == 'true' && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.test.result == 'failure')
        run: |
          echo "::error::Not building — lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }}"
          exit 1

      - name: Checkout
        if: needs.changes.outputs.code == 'true' && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.test.result != 'failure'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: needs.changes.outputs.code == 'true' && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.test.result != 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Cache Next.js build
        if: needs.changes.outputs.code == 'true' && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.test.result != 'failure'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true' && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.test.result != 'failure'
        run: bun install --frozen-lockfile

      - name: Run build
        if: needs.changes.outputs.code == 'true' && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.test.result != 'failure'
        run: bun run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, build]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Set deploy environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VERCEL_ENV=production" >> "$GITHUB_ENV"
            echo "VERCEL_PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"
            echo "VERCEL_PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }}

      - name: Build project artifacts
        run: vercel build ${{ env.VERCEL_PROD_FLAG }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt ${{ env.VERCEL_PROD_FLAG }}
